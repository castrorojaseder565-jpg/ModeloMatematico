spring.application.name=eduoptima-ai

# ── Base de Datos MySQL ───────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/eduoptima_db
spring.datasource.username=root
spring.datasource.password=12345

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Servidor ──────────────────────────────────────────────────
server.port=8080

# ── Microservicio Python ──────────────────────────────────────
optimizer.api.url=http://127.0.0.1:8000/optimize
