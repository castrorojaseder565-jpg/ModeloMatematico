<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Estudiantes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Estudiantes</h2>
        <a class="btn btn-primary" th:href="@{/students/new}">+ Nuevo estudiante</a>
    </div>
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Área temática</th><th>Riesgo (1–5)</th><th>Prioridad (1–10)</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.topic}"></td>
            <td th:text="${s.academicRisk}"></td>
            <td th:text="${s.priority}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{/students/edit/{id}(id=${s.id})}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{/students/delete/{id}(id=${s.id})}"
                   onclick="return confirm('¿Eliminar este estudiante?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="text-center text-muted">Sin estudiantes registrados</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
